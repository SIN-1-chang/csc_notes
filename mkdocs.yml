site_name: csc_notes
site_url: https://<你的用户名>.github.io/csc_notes/
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs          # 第一层分类升到顶部横栏
    - navigation.sections      # 侧边栏把课程折叠成分组
    - navigation.indexes       # 让 index.md 成为分组的可点击标题
    - navigation.top
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 关于: about.md

  - 计算机科学:
      - 总览: computer_science/index.md
      - 数值分析:
          - 总览: computer_science/numerical_analysis/index.md
          - 数值误差: computer_science/numerical_analysis/numerical_errors.md

  - 数理基础课:
      - 总览: mathematical_sciences/index.md
      - 概率论与数理统计:
          - 总览: mathematical_sciences/probability_theory_and_statistics/index.md
          - 基础概念: mathematical_sciences/probability_theory_and_statistics/1_basic_concepts.md
          - 随机变量及其分布: mathematical_sciences/probability_theory_and_statistics/2_random_variables_and_distributions.md
          - 多维随机变量及其分布: mathematical_sciences/probability_theory_and_statistics/3_multivariate_distributions.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
