site_name: csc_notes
site_url: https://<你的用户名>.github.io/csc_notes/
docs_dir: docs

theme:
  name: material
  language: zh
  features:
    - navigation.tabs          # 第一层分类升到顶部横栏
    - navigation.sections      # 侧边栏把课程折叠成分组
    - navigation.indexes       # 让 index.md 成为分组的可点击标题
    - navigation.top
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式

nav:
  - 首页: index.md
  - 数学与自然科学:
      - 概览: mathematical_sciences/index.md
      - 普通物理: mathematical_sciences/general_physics/index.md
      - 概率论与数理统计: mathematical_sciences/probability_theory_and_statistics/index.md
      - 数值分析: mathematical_sciences/numerical_analysis/index.md
  - 计算机科学: computer_science/index.md
  - 关于: about.md

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
